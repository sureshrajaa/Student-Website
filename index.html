<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center><h1>Student Registration Form</h1></center> <br> <br> <hr>
    <label>Name:</label>
    <input type="text"placeholder="Enter your name"> <br><br>
    <label>Date of Birth:</label>
    <input type="date"><br><br>
    <label>Email:</label>
    <input type="email"placeholder="Enter your mail"><br><br>
    <label>Password:</label>
    <input type="password" placeholder="Enter your password"><br><br>
    <label>Age:</label>
    <input type="number"placeholder ="Enter your Age"><br><br>
    <label>Gender:</label>
    <input type="radio"name="gender">
    <label>Male</label>
    <input type="radio"name="gender">
    <label>Female</label>
    <input type="radio" name="gender">
    <label>Others</label><br><br>
    <label>Contact No:</label>
    <input type="tel" name="contact number"> <br><br>
    <label>Department:</label>
    <select>
        <option>Select</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>AD</option>
        <option>EEE</option>
        <option>E&I</option>
    </select> &nbsp
    <label>Year of study:</label>
    <input type="radio" name="year">
    <label>I</label>
    <input type="radio" name="year">
    <label>II</label>
    <input type="radio" name="year">
    <label>III</label>
    <input type="radio" name="year">
    <label>IV</label> <br> <br>
      <label>Skills:</label>
    <textarea placeholder="Skills"></textarea><br><br> <hr>
    <button>Submit</button> &nbsp
    <button>Save</button> &nbsp
    <button>Reset</button> &nbsp <br><br>

</body>
</html>
